plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.versutus.handsfreevoice'
version = '0.1.0'

android {
  namespace "com.versutus.handsfreevoice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The version React Native itself resolves, so the Gate media socket does not
  // drag a second OkHttp into the APK.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  testImplementation 'junit:junit:4.13.2'
  // Android provides org.json at runtime; the JVM tests need a real one.
  testImplementation 'org.json:json:20231013'
}
