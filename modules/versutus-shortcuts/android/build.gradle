group = 'com.versutus.shortcuts'
version = '0.1.0'

buildscript {
  ext.getExtOrDefault = { prop, defVal ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : defVal
  }
  repositories {
    google()
    mavenCentral()
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.versutus.shortcuts"
  compileSdkVersion getExtOrDefault('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrDefault('targetSdkVersion', 36)
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
}
