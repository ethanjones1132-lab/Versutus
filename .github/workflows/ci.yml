name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The gate is proven on Node 24, the host's version. Node 20's
      # `node --test` takes no glob arguments, so test:gate's quoted
      # "__tests__/*.test.mjs" finds nothing there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install pytest numpy
      # Identical to what contributors run locally as `npm run verify`, so CI
      # and local checks cannot drift apart.
      - name: Verify (typecheck, lint, unit + gate tests)
        run: npm run verify
      # The worker suite uses synthetic audio and fakes, so no model is fetched.
      - name: Voice worker tests
        run: npm run test:voice-worker
      - name: Portal smoke tests
        run: npm run smoke:portal
