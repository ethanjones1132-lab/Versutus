name: Verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Identical to what contributors run locally as `npm run verify`, so CI
      # and local checks cannot drift apart.
      - name: Verify (typecheck, lint, unit + gate tests)
        run: npm run verify
      - name: Portal smoke tests
        run: npm run smoke:portal
